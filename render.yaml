# Render Infrastructure Blueprint Configuration
# AI Expense & Business Analytics SaaS

services:
  # -------------------------------------------------------------
  # 1. Laravel REST API Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: ai-expense-backend
    env: php
    rootDir: backend
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan migrate --force
    startCommand: vendor/bin/heroku-php-apache2 public/
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ai-expense-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ai-expense-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ai-expense-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ai-expense-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ai-expense-db
          property: password
      - key: ANALYTICS_SERVICE_URL
        sync: false
      - key: ANALYTICS_SERVICE_TOKEN
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. Python FastAPI Analytics Service
  # -------------------------------------------------------------
  - type: web
    name: ai-expense-analytics
    env: python
    rootDir: analytics-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ANALYTICS_SERVICE_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-expense-db
          property: connectionString

  # -------------------------------------------------------------
  # 3. React.js Frontend Static Site (SPA)
  # -------------------------------------------------------------
  - type: static
    name: ai-expense-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback routing rule
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_NAME
        value: "AI Expense & Business Analytics"

databases:
  # -------------------------------------------------------------
  # 4. PostgreSQL Managed Database
  # -------------------------------------------------------------
  - name: ai-expense-db
    databaseName: ai_expense_db
    user: postgres
    plan: free
